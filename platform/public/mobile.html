<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반장 리더십 RACE · 교육생용</title>
<style>
  :root{
    --bg:#06070A; --card:#111318; --input:#2C313C; --border:rgba(255,255,255,.34);
    --red:#E10600; --red-soft:#FF2A21; --teal:#00D2BE; --amber:#FFD400; --blue:#3671C6;
    --text:#fff; --muted:#B4BBC7; --light:#DCE0E7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;word-break:keep-all}
  input,textarea,button{font-family:inherit}
  a{color:var(--red)}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .pad{padding:20px 16px 44px}
  label{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .lbl{font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--light)}
  input[type=text],textarea{background:var(--input);border:1px solid var(--border);color:#fff;font-weight:600;font-size:17px;padding:13px;outline:none;width:100%;border-radius:2px}
  textarea{resize:none;line-height:1.5}
  .btn{border:none;padding:16px;font-weight:700;font-size:15px;letter-spacing:.1em;cursor:pointer;width:100%;border-radius:2px;min-height:54px}
  .btn-primary{background:var(--red);color:#fff}
  .btn-disabled{background:#20242D;color:#8A92A0;cursor:not-allowed}
  .btn-ghost{background:transparent;color:#fff;border:1px solid var(--border)}
  .btn-teal{background:var(--teal);color:#06070A}
  .card{background:var(--card);padding:16px;border-radius:2px}
  .bar{width:120px;height:5px;background:var(--red);margin:12px 0 20px}
  h1{font-weight:900;font-size:30px;line-height:1.15;margin:6px 0 0}
  h2{font-size:22px;font-weight:700;margin:8px 0 0;line-height:1.35}
  .eyebrow{font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--red-soft)}
  .kicker{font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--light)}
  .muted{color:var(--muted);font-size:14px;line-height:1.6}
  .grid8{display:flex;flex-wrap:wrap;gap:6px}
  .pick{flex:1;min-width:52px;height:52px;background:var(--input);color:#fff;border:1px solid var(--border);font-weight:700;font-size:18px;cursor:pointer;border-radius:2px}
  .pick.on{background:var(--red);border-color:var(--red)}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.12)}
  .topbar-inner{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hamburger{background:none;border:none;color:#fff;display:flex;flex-direction:column;gap:4px;cursor:pointer;padding:6px}
  .hamburger span{width:20px;height:2px;background:#fff;display:block}
  .hamburger span:first-child{background:var(--red)}
  .actchip{background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:6px 12px;display:inline-flex;gap:8px;margin:0 16px 10px}
  .live{display:flex;align-items:center;gap:6px;font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--teal)}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--teal);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .progress{height:6px;background:#20242D;overflow:hidden;margin:10px 0}
  .progress i{display:block;height:100%;background:var(--teal);transition:width .2s}
  .scale{display:flex;gap:6px;margin-top:10px}
  .scalebtn{flex:1;min-height:46px;background:var(--input);color:#fff;border:1px solid var(--border);font-weight:900;font-size:17px;cursor:pointer;border-radius:2px}
  .scalebtn.on{color:#06070A}
  .q{background:var(--card);border-left:3px solid rgba(255,255,255,.16);padding:14px;margin-bottom:10px;border-radius:2px}
  .banner{padding:14px 16px;font-size:15px;line-height:1.5;border-radius:2px;margin:10px 0}
  .banner-ok{background:#0E1A16;border-left:4px solid var(--teal);color:#9BE9DC}
  .banner-err{background:#2A0A08;border-left:4px solid var(--red);color:#FF9A94}
  .score-hero{background:var(--red);color:#fff;padding:22px;border-radius:2px;margin:10px 0}
  .score-num{font-weight:900;font-size:52px}
  .area{background:var(--card);padding:13px 15px;margin-bottom:8px;border-radius:2px}
  .drawer-mask{position:fixed;inset:0;background:rgba(6,7,10,.7);z-index:20}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:320px;z-index:21;background:#0C0E12;border-right:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column}
  .drawer-item{width:100%;background:transparent;border:none;border-left:4px solid transparent;color:#fff;text-align:left;padding:14px 18px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
  .drawer-item.cur{background:#181C23}
  .nextbar{margin-top:auto;background:var(--red);color:#fff;border:none;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;min-height:64px;text-align:left;border-radius:2px}
  .nextbar[disabled]{background:#20242D;color:#8A92A0;cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{border:1px solid var(--border);background:var(--input);color:#fff;padding:10px 14px;font-size:14px;border-radius:99px;cursor:pointer}
  .chip.on{background:var(--teal);color:#06070A;border-color:var(--teal)}
  .slider{width:100%;margin:14px 0 4px}
  .slider-val{font-weight:900;font-size:32px;color:var(--teal)}
  .approach{background:var(--card);padding:14px;border-radius:2px;margin-bottom:10px;border:1px solid rgba(255,255,255,.1)}
  .approach.sel{border-color:var(--teal)}
  .rowbtns{display:flex;gap:8px;margin-top:10px}
  .rowbtns button{flex:1;padding:10px;font-size:13px;border-radius:2px;border:1px solid var(--border);background:transparent;color:#fff;cursor:pointer}
  .rowbtns button.sel{background:var(--teal);color:#06070A;border-color:var(--teal)}
  .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--teal);border-radius:99px;animation:spin .8s linear infinite;margin:24px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lgws-sync.js"></script>
<script src="mobile.js"></script>
</body>
</html>
